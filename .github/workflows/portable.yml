name: Portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to publish as a release, e.g. 1.0.1 (creates the tag v1.0.1). Leave empty for a plain build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      PUBLISH_DIR: ${{ github.workspace }}\out\Caret-Portable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build the editor bundle
        working-directory: src/Caret.Editor
        # react-scripts turns every lint warning into an error when CI=true.
        env:
          CI: 'false'
        run: |
          npm install --global yarn
          yarn install --frozen-lockfile --network-timeout 600000
          yarn build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build the portable folder
        shell: pwsh
        run: ./build/package.ps1 -Platform ${{ matrix.platform }}

      # Starts the app the way a user would (double-click, no install) and checks that it gets as far as
      # loading the editor, from a copy in a fresh folder so nothing from the build output helps it.
      - name: Smoke test
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke\Caret-Portable'
          New-Item -ItemType Directory (Split-Path $dir) -Force | Out-Null
          Copy-Item $env:PUBLISH_DIR $dir -Recurse
          $log = Join-Path $env:TEMP 'caret_winui_probe.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          # The top-level Caret.exe is the launcher: it starts app\Caret.exe and exits.
          # (Not -Wait: in PowerShell 7 that also waits for the app the launcher starts.)
          $launcher = Start-Process (Join-Path $dir 'Caret.exe') -PassThru
          if (-not $launcher.WaitForExit(30000)) { throw 'The launcher did not exit' }
          if ($launcher.ExitCode -ne 0) { throw "The launcher failed (exit code $($launcher.ExitCode))" }
          $appExe = Join-Path $dir 'app\Caret.exe'
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'CoreWebView2 initialized OK' -Quiet)) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log | Select-Object -First 12 }
          $app = Get-Process -Name Caret -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $appExe }
          if (-not $app) { throw 'app\Caret.exe is not running: the launcher did not start it, or it exited on its own' }
          $app | Stop-Process -Force
          if (-not $ok) { throw 'Caret started but the editor never finished loading' }
          'Top level: ' + ((Get-ChildItem $dir | ForEach-Object Name) -join ', ')
          'Data: ' + ((Get-ChildItem (Join-Path $dir 'Data') -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')
          if (-not (Test-Path (Join-Path $dir 'Data\WebView2'))) { throw 'The WebView2 profile is not in the Data folder next to Caret.exe (see "WebView2 profile" in the log above)' }
          if (Test-Path (Join-Path $dir 'app\Data')) { throw 'Caret put its Data folder inside app instead of next to the launcher' }
          'Caret started from a plain folder through the launcher and loaded the editor.'

      - name: Zip
        shell: pwsh
        run: |
          $v = [version](Get-Item "$env:PUBLISH_DIR\app\Caret.exe").VersionInfo.FileVersion
          Compress-Archive -Path "$env:PUBLISH_DIR" -DestinationPath ("out\Caret-Portable-{0}.{1}.{2}-${{ matrix.platform }}.zip" -f $v.Major, $v.Minor, $v.Build)

      - uses: actions/upload-artifact@v5
        with:
          name: Caret-Portable-${{ matrix.platform }}
          path: out/Caret-Portable-*-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Release
    # A pushed v* tag, or Run workflow with a version (which creates the tag on the commit it built).
    # Plain gh commands (preinstalled on the runner) instead of release actions.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED: ${{ inputs.release }}
    steps:
      - name: Publish
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then version="${REQUESTED#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          raw() { gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/$1?ref=$GITHUB_SHA"; }

          project=$(raw src/Caret.App/Caret.App.csproj | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -1)
          if [ "$version" != "$project" ]; then echo "Asked to release $version, but src/Caret.App/Caret.App.csproj says $project"; exit 1; fi

          # The release text is this version's section of CHANGELOG.md ("## 1.0.1" for v1.0.1).
          raw CHANGELOG.md | awk -v h="## $version" '$0 == h {on = 1; next} /^## / {on = 0} on' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "CHANGELOG.md has no '## $version' section"; exit 1; fi
          cat >> notes.md <<'NOTES'

          **Download** the zip for your PC (x64 for most, ARM64 for Windows on ARM), unzip it anywhere you can write to, and double-click `Caret.exe`. Needs Python 3.10+ with MarkItDown; see the README inside the zip.
          NOTES
          cat notes.md

          gh run download "$GITHUB_RUN_ID" --pattern 'Caret-Portable-*' --dir dist
          ls -R dist
          gh release create "v$version" dist/*/*.zip --target "$GITHUB_SHA" --title "Caret Portable $version" --notes-file notes.md
